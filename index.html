<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ghea — Música y Narración</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #24392e 0%, #111a16 45%, #080c0a 100%);
      color: #f1e4c5;
      font-family: Georgia, "Times New Roman", serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .panel {
      width: 100%;
      max-width: 520px;

      background: rgba(17, 25, 21, 0.95);

      border: 2px solid #a98543;
      border-radius: 22px;

      padding: 30px 20px;

      text-align: center;

      box-shadow:
        0 0 0 4px rgba(169,133,67,0.15),
        0 15px 40px rgba(0,0,0,0.55);
    }

    .ghea {
      font-size: 42px;
      letter-spacing: 5px;
      color: #d7b66d;
      margin-bottom: 6px;
    }

    .subtitulo {
      color: #a99872;
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 35px;
    }

    .icono {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 10px;
      color: #f3dfad;
    }

    .descripcion {
      color: #c9bea4;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    video {
      width: 100%;
      border-radius: 14px;
      border: 1px solid #6f5a32;
      background: #000;
    }

    .bardo {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #54472f;

      color: #998b70;
      font-size: 14px;
      font-style: italic;
    }

    .pie {
      margin-top: 28px;
      color: #6f6655;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="panel">

    <div class="ghea">GHEA</div>

    <div class="subtitulo">
      Música y Narración
    </div>

    <div class="icono">🎙️</div>

    <h1>Bienvenidos a Ghea</h1>

    <p class="descripcion">
      Escuchad, Aventureros.<br>
      Toda gran historia tiene un comienzo...
    </p>

    <video controls playsinline preload="metadata">
  <source
    src="https://haeb03.github.io/ghea-media/bienvenidosaghea.mp4?v=2"
    type="video/mp4"
  >
  Tu navegador no puede reproducir este contenido.
    </video>

    <div class="bardo">
      🎵 Narrado por el Bardo de Ghea
    </div>

    <div class="pie">
      GHEA · LIBRO DE AVENTURAS
    </div>

  </main>

</body>
</html>
